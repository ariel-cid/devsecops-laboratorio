name: Laboratorio Final Workflow
on:
  push:
    branches:
      - feature/*

jobs:
  SAST:
    runs-on: ubuntu-latest
    steps:
      - name: Curso Dev SecOps - Laboratorio Final - SAST with Sonarcloud
        run: |
          echo "Curso DevSecOps"
          echo "Laboratorio Final"
          echo "SAST with Sonarcloud"

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validating existence of project in Sonarcloud
        id: validate-project-sonar
        run: |
          set +e
          curl -f -X POST -u '${{ secrets.SONAR_TOKEN }}:' 'https://sonarcloud.io/api/projects/create' -d 'name=${{ github.event.repository.name }}' -d 'organization=curso-seguridad-usach' -d 'project=${{ github.event.repository.name }}' -d 'visibility=public' 
          if [ $? -ne 0 ]; then
            echo "Proyecto ya existe en SonarCloud"
            echo "::set-output name=proyectoExiste::1"
          else
            echo "Proyecto ${{ github.event.repository.name }} creado exitosamente en Sonarcloud"
            echo "Se establece rama main por omisión"
            curl -X POST -u '${{ secrets.SONAR_TOKEN }}:' 'https://sonarcloud.io/api/project_branches/rename' -d 'name=main' -d 'project=${{ github.event.repository.name }}'
          fi

      - name: Executing Sonarcloud
        run: |
          npx sonar-scanner \
            -Dsonar.projectKey=${{ github.event.repository.name }}\
            -Dsonar.organization=curso-seguridad-usach\
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}\
            -Dsonar.branch.name=main

      - name: Validating Sonarcloud results
        run: |
          severities=$(curl -s -X GET -u '${{ secrets.SONAR_TOKEN }}:' 'https://sonarcloud.io/api/issues/search?branch=main&componentKeys=${{ github.event.repository.name }}&facets=severities' | jq '.facets[0].values')
          echo "Severities: $severities"
          blocker=$(echo $severities | jq '.[] | select(.val=="BLOCKER") | .count')
          echo "Blocker Issues: $blocker"
          critical=$(echo $severities | jq '.[] | select(.val=="CRITICAL") | .count')
          echo "Critical Issues: $critical"
          major=$(echo $severities | jq '.[] | select(.val=="MAJOR") | .count')
          echo "Major Issues: $major" 
          # Breaking pipeline in case of issues found
          if [ "$blocker" -gt 0 ] || [ "$critical" -gt 0 ] || [ "$major" -gt 0 ]; then
            echo "Análisis SAST - Se encontraron issues de seguridad. Pipeline se quiebra."
            # exit 1
          else
            echo "Análisis SAST - No se encontraron issues de seguridad. Pipeline continua."
          fi

  SCA:
    needs: SAST
    runs-on: ubuntu-latest
    steps:
      - name: Curso Dev SecOps - Laboratorio Final
        run: |
          echo "Curso DevSecOps"
          echo "Laboratorio Final"
          echo "SCA with Dependency Check"
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build project
        run: |
          npm run build
      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: '${{ github.event.repository.name }}'
          path: '.'
          format: 'HTML'
          #args: >
            #--failOnCVSS 4
            #--enableRetired

      - name: Upload OWASP Dependency Check Report
        if: always()
        uses: actions/upload-artifact@master
        with:
          name: dependency-check-report
          path: ${{ github.workspace }}/reports
      
      - name: Upload Artifact
        uses: actions/upload-artifact@master
        with:
          name: devsec-laboratorio-build
          path: ${{ github.workspace }}/functions/

  DOCKER-BUILD:
    needs: SCA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@master
        with:
          name: devsec-laboratorio-build
          path: ${{github.workspace}}/


